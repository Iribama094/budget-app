name: Deploy to Vercel

on:
  push:
    branches:
      - main
  # Lets you re-run a deploy from the Actions tab without pushing a commit.
  workflow_dispatch:

concurrency:
  group: vercel-production
  cancel-in-progress: true

jobs:
  vercel-deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      # Say plainly which credential is missing instead of failing deep inside the Vercel CLI.
      - name: Check the Vercel credentials are set
        run: |
          missing=""
          [ -n "$VERCEL_TOKEN" ] || missing="$missing VERCEL_TOKEN"
          [ -n "$VERCEL_ORG_ID" ] || missing="$missing VERCEL_ORG_ID"
          [ -n "$VERCEL_PROJECT_ID" ] || missing="$missing VERCEL_PROJECT_ID"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secret(s):$missing"
            echo "Add them under Settings > Secrets and variables > Actions."
            echo "VERCEL_TOKEN comes from https://vercel.com/account/tokens (it expires, so an old one stops working)."
            echo "VERCEL_ORG_ID and VERCEL_PROJECT_ID are in .vercel/project.json after running 'npx vercel link'."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # The official CLI: pull the project settings, build with them, then upload the finished build.
      - name: Pull project settings
        run: npx vercel@latest pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build
        run: npx vercel@latest build --prod --token="$VERCEL_TOKEN"

      - name: Deploy
        run: npx vercel@latest deploy --prebuilt --prod --token="$VERCEL_TOKEN"
